<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ task.title }} | Task Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .details-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }
        .details-header {
            margin-bottom: 30px;
        }
        .list-group-item {
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <div class="container details-container">
        <div class="details-header">
            <h2 class="mb-0">{{ task.title }}</h2>
        </div>

        <ul class="list-group mb-4">
            <li class="list-group-item"><strong>Status:</strong> {{ task.get_status_display }}</li>
            <li class="list-group-item"><strong>Priority:</strong> {{ task.get_priority_display }}</li>
            <li class="list-group-item"><strong>Created:</strong> {{ task.created_at }}</li>
            <li class="list-group-item"><strong>Due:</strong> {{ task.due_date }}</li>
        </ul>

        <div class="d-flex justify-content-between">
            <a href="{% url 'task-update' task.id %}" class="btn btn-outline-warning">✏️ Edit Task</a>
            <a href="{% url 'task-list' %}" class="btn btn-outline-secondary">← Back to List</a>
        </div>
    </div>
</body>
</html>
