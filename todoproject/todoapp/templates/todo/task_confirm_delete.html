<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete | {{ object.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .delete-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }
        .delete-header {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container delete-container">
        <div class="delete-header">
            <h2 class="text-danger mb-3">Delete Task</h2>
            <h5 class="mb-3">Are you sure you want to permanently delete <strong>{{ object.title }}</strong>?</h5>
            <p class="text-muted">This action cannot be undone.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'task-list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
